<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/main-logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!--
      Web fonts are linked here (instead of an @import inside the CSS bundle)
      so the browser discovers them from the HTML and starts the connection
      before the app CSS/JS has even finished downloading. Only the weights
      the UI actually uses are requested (mono 400, display 700/800).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Archivo+Black&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&family=Syne:wght@700;800&family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Caveat:wght@500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Geist:wght@300;400;500;600;700&display=swap"
    />
    <!-- Preloader artwork: fetched in parallel with the JS bundle so the intro can start on the first frame -->
    <link rel="preload" as="image" type="image/webp" href="%PUBLIC_URL%/assets/preloader/ai-hand.webp" />
    <link rel="preload" as="image" type="image/webp" href="%PUBLIC_URL%/assets/preloader/ink.webp" />
    <link rel="preload" as="image" type="image/webp" href="%PUBLIC_URL%/assets/preloader/human-hand.webp" />
    <link rel="preload" as="image" type="image/webp" href="%PUBLIC_URL%/assets/preloader/spark.webp" />
    <!-- Team/faculty photos and the sponsor logo are served from these hosts -->
    <link rel="preconnect" href="https://i.postimg.cc" />
    <link rel="dns-prefetch" href="https://ik.imagekit.io" />
    <meta
      name="description"
      content="Welcome To AIvolution - MAIT Delhi's Official AI Society!"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/main-logo-icon.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>AIvolution</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- Paper-coloured cover so the page never flashes dark before React mounts; Preloader removes it. -->
    <div id="preload-shell" style="position:fixed;inset:0;z-index:9980;background:#f3eee2"></div>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
